[project]
name = "codepilot-backend"
description = "CodePilot AI backend: multi-agent coding assistant with RAG."
requires-python = ">=3.12,<3.13"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "structlog>=24.4,<27.0",
    "sqlalchemy[asyncio]>=2.0.35,<2.1",
    "asyncpg>=0.30,<0.31",
    "qdrant-client>=1.12,<2.0",
    "httpx>=0.27,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=5.0,<8.0",
    "asgi-lifespan>=2.1,<3.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "import-linter>=2.1,<3.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/codepilot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/codepilot"]

[tool.uv]
package = true

# ---------------------------------------------------------------------------
# Testing
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["codepilot"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# Linting & formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "S", "D", "RUF",
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "S105", "S106", "S311"]
"src/codepilot/**/__init__.py" = ["D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------------------
# Architecture boundaries
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "codepilot"

[[tool.importlinter.contracts]]
name = "Domain models stay pure"
type = "forbidden"
source_modules = ["codepilot.models"]
forbidden_modules = [
    "codepilot.api",
    "codepilot.services",
    "codepilot.db",
    "codepilot.vector_db",
    "codepilot.config",
    "codepilot.container",
]

[[tool.importlinter.contracts]]
name = "Configuration has no upward dependencies"
type = "forbidden"
source_modules = ["codepilot.config"]
forbidden_modules = [
    "codepilot.api",
    "codepilot.services",
    "codepilot.container",
    "codepilot.app",
]

[[tool.importlinter.contracts]]
name = "API does not touch infrastructure directly"
type = "forbidden"
source_modules = ["codepilot.api"]
forbidden_modules = ["codepilot.db", "codepilot.vector_db"]
# The dependency wiring module is allowed to import the composition root; the
# ignore below stops the indirect chain at that single, reviewed edge.
ignore_imports = ["codepilot.api.deps -> codepilot.container"]
